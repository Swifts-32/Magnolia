version: "3.9"

networks:
  magnolia_net:
    driver: bridge

services:
  traefik:
    image: traefik:v2.10
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - magnolia_net

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - magnolia_net

  migrations:
    image: swifts32/magnolia-migrations:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:mypassword@db:5432/postgres
    networks:
      - magnolia_net

  app:
    image: swifts32/magnoliawebapp:latest
    restart: always
    environment:
      DATABASE_URL: postgres://postgres:mypassword@db:5432/postgres
    depends_on:
      migrations:
        condition: service_completed_successfully
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.magnolia.rule=Host(`train.local`)"
      - "traefik.http.services.magnolia.loadbalancer.server.port=8080"
    networks:
      - magnolia_net

volumes:
  postgres_data:
