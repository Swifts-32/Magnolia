networks:
  magnolia_net:
    driver: bridge

services:
  traefik:
    image: traefik:latest
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - magnolia_net

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - magnolia_net

  migrations:
    image: swifts32/magnolia-migrations:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:mypassword@db:5432/postgres
    networks:
      - magnolia_net

  app:
    image: swifts32/magnoliawebapp:latest
    privileged: true
    environment:
      DATABASE_URL: postgres://postgres:mypassword@db:5432/postgres
      ORIGIN: http://train.local
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes:
      - /dev:/dev
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.magnolia.rule=Host(`train.local`)"
      - "traefik.http.services.magnolia.loadbalancer.server.port=8080"
    networks:
      - magnolia_net

volumes:
  postgres_data:
