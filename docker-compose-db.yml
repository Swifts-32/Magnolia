services:
  db:
    image: postgres:16-alpine
    container_name: magnolia-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      # Maps host port 5433 to container port 5432 to bypass the port conflict
      - "5433:5432"
    volumes:
      # Persists your database data locally so it survives container restarts
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

