name: Build and Push to Cachix

on:
  push:
    branches: [release]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Restore & Save Nix Store Cache
        uses: nix-community/cache-action@v6
        with:
          primary-key: nix-${{ matrix.system }}-${{ hashFiles('**/flake.lock', '**/package.json', '**/bun.lockb') }}
          restore-keys: |
            nix-${{ matrix.system }}-

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: magnolia
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build Package for ${{ matrix.system }}
        run: nix build .#packages.${{ matrix.system }}.default
